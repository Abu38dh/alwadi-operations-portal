<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A89D"/>
      <stop offset="100%" stop-color="#028077"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00A89D" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect x="25" y="25" width="150" height="150" rx="42" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  
  <!-- Flow / Process Pathways (Masar theme) -->
  <path d="M60 135 L85 75 L115 130 L140 65" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="60" cy="135" r="8" fill="#5EEAD4"/>
  <circle cx="85" cy="75" r="7" fill="white"/>
  <circle cx="115" cy="130" r="7" fill="white"/>
  <circle cx="140" cy="65" r="9" fill="#5EEAD4"/>
</svg>

